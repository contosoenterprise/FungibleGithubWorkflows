# GitHub Actions workflow to trigger ADO build via OIDC
# Receives repository_dispatch from other repos and authenticates with Azure

name: Trigger ADO Build (OIDC)

on:
  repository_dispatch:
    types: [trigger-ado-build]

permissions:
  id-token: write
  contents: read

jobs:
  trigger-ado-build:
    name: Trigger ADO Build
    runs-on: ubuntu-slim
    environment: copilot

    steps:
      - name: Extract Dispatch Information
        id: pr-info
        run: |
          echo "pr_number=${{ github.event.client_payload.pr_number }}" >> $GITHUB_OUTPUT
          echo "repo_name=${{ github.event.client_payload.repo_name }}" >> $GITHUB_OUTPUT
          echo "repo_owner=${{ github.event.client_payload.repo_owner }}" >> $GITHUB_OUTPUT
          echo "branch_name=${{ github.event.client_payload.branch_name }}" >> $GITHUB_OUTPUT
          echo "target_branch=${{ github.event.client_payload.target_branch }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.event.client_payload.commit_sha }}" >> $GITHUB_OUTPUT
          echo "pr_user=${{ github.event.client_payload.pr_user }}" >> $GITHUB_OUTPUT
          echo "source_repo=${{ github.event.client_payload.source_repo }}" >> $GITHUB_OUTPUT

          echo "📋 Received Dispatch:"
          echo "  Source: ${{ github.event.client_payload.source_repo }}"
          echo "  Repository: ${{ github.event.client_payload.repo_name }}"
          echo "  PR Number: ${{ github.event.client_payload.pr_number }}"
          echo "  Branch: ${{ github.event.client_payload.branch_name }}"
          echo "  Target: ${{ github.event.client_payload.target_branch }}"
          echo "  Commit: ${{ github.event.client_payload.commit_sha }}"
          echo "  User: ${{ github.event.client_payload.pr_user }}"

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure DevOps Access Token
        id: get-token
        run: |
          ACCESS_TOKEN=$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ado_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Obtained Azure DevOps access token"

      - name: Cancel Previous ADO Builds
        env:
          ADO_TOKEN: ${{ steps.get-token.outputs.ado_token }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.SOURCE_REPO_STATUS_TOKEN }}
          SOURCE_REPO: ${{ steps.pr-info.outputs.source_repo }}
        run: |
          echo "🔍 Checking for previous in-progress builds for PR #${PR_NUMBER}..."
          
          ADO_URL="https://dev.azure.com/AzureCSI/Fungible/_apis/build/builds"
          QUERY="definitions=13484&statusFilter=inProgress,notStarted&api-version=7.0"
          
          BUILDS_RESPONSE=$(curl -s -H "Authorization: Bearer ${ADO_TOKEN}" "${ADO_URL}?${QUERY}")

          if ! echo "$BUILDS_RESPONSE" | jq empty 2>/dev/null; then
            echo "❌ Invalid JSON response from ADO API"
            echo "$BUILDS_RESPONSE"
            exit 1
          fi

          BUILD_IDS=$(echo "$BUILDS_RESPONSE" | jq -r --arg pr "${PR_NUMBER}" \
            '.value[] | select(.templateParameters.github_pr_number == $pr) | .id')

          if [ -z "$BUILD_IDS" ]; then
            echo "✅ No previous in-progress builds found for this PR"
          else
            for BUILD_ID in $BUILD_IDS; do
              echo "🚫 Canceling build $BUILD_ID..."
              curl -s -X PATCH \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${ADO_TOKEN}" \
                -d '{"status": "Cancelling"}' \
                "https://dev.azure.com/AzureCSI/Fungible/_apis/build/builds/${BUILD_ID}?api-version=7.0" > /dev/null
            done
          fi

      - name: Trigger ADO Pipeline
        id: trigger-ado
        env:
          ADO_TOKEN: ${{ steps.get-token.outputs.ado_token }}
        run: |
          COMMIT_SHA="${{ steps.pr-info.outputs.commit_sha }}"
          PR_USER="${{ steps.pr-info.outputs.pr_user }}"
          REPO_NAME="${{ steps.pr-info.outputs.repo_name }}"
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          BRANCH_NAME="${{ steps.pr-info.outputs.branch_name }}"
          TARGET_BRANCH="${{ steps.pr-info.outputs.target_branch }}"

          RUN_NAME="${REPO_NAME} - PR ${PR_NUMBER} - ${PR_USER} - ${COMMIT_SHA:0:7}"
          RUN_NAME_SANITIZED=$(echo "$RUN_NAME" | tr -d '#' | tr ':/' '--')
          RUN_NAME_SHORT="${RUN_NAME_SANITIZED:0:180}"

          PR_MAP=$(jq -n --arg repo "$REPO_NAME" --arg branch "$BRANCH_NAME" '{($repo): $branch}')

          # FunSDK is the primary repo checked out via ADO resources.repositories
          # (all other repos are cloned by bob). When FunSDK itself is the PR source,
          # we must tell ADO to check out the PR branch instead of the default.
          # When targeting a hotfix branch, FunSDK should also be on that branch.
          if [[ "$REPO_NAME" == "FunSDK-small" ]]; then
            FUNSDK_BRANCH="$BRANCH_NAME"
          elif [[ "$TARGET_BRANCH" =~ ^hotfix_.+ || "$TARGET_BRANCH" == "stable" || "$TARGET_BRANCH" =~ ^rel_.+ ]]; then
            FUNSDK_BRANCH="$TARGET_BRANCH"
          else
            FUNSDK_BRANCH="master"
          fi

          JSON_PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg pr "$PR_NUMBER" \
            --arg branch "$BRANCH_NAME" \
            --arg targetBranch "$TARGET_BRANCH" \
            --arg commitSha "$COMMIT_SHA" \
            --arg runName "$RUN_NAME_SHORT" \
            --arg funsdk "$FUNSDK_BRANCH" \
            --argjson branchOverrides "$PR_MAP" \
            '{
              templateParameters: {
                github_repo: $repo,
                github_pr_number: $pr,
                github_branch: $branch,
                github_target_branch: $targetBranch,
                github_commit_sha: $commitSha,
                runName: $runName,
                funsdk_branch: $funsdk,
                branch_overrides: ($branchOverrides | tojson),
                enableMFGRelease: "true",
                enableFatTarball: "true"
              }
            }')

          echo "📋 Payload: $JSON_PAYLOAD"

          ADO_PIPELINE_URL="https://dev.azure.com/AzureCSI/Fungible/_apis/pipelines/13484/runs?api-version=7.0"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ADO_TOKEN}" \
            -d "${JSON_PAYLOAD}" \
            "${ADO_PIPELINE_URL}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Failed to trigger ADO pipeline. HTTP code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

          RUN_ID=$(echo "$BODY" | jq -r '.id')
          RUN_URL=$(echo "$BODY" | jq -r '._links.web.href')
          BUILD_ID=$(echo "$RUN_URL" | grep -oE 'buildId=[0-9]+' | cut -d= -f2 || echo "$RUN_ID")

          echo "ado_run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "ado_build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "ado_run_url=$RUN_URL" >> $GITHUB_OUTPUT
          echo "✅ Triggered ADO pipeline run: $RUN_ID"
          echo "🔗 Build URL: $RUN_URL"

      - name: Create Commit Status
        if: success()
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_STATUS_TOKEN }}
          SOURCE_REPO: ${{ steps.pr-info.outputs.source_repo }}
          COMMIT_SHA: ${{ steps.pr-info.outputs.commit_sha }}
          ADO_URL: ${{ steps.trigger-ado.outputs.ado_run_url }}
          ADO_BUILD_ID: ${{ steps.trigger-ado.outputs.ado_build_id }}
        run: |
          # Create commit status. No PR comment is posted here — build-start
          # is a transient stage and, per policy, only the final result gets
          # emailed to the PR author (handled by the ADO pipeline itself via
          # FunAzMirror/update_github_comment.py).
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${SOURCE_REPO}/statuses/${COMMIT_SHA}" \
            -d "{
              \"state\": \"pending\",
              \"target_url\": \"${ADO_URL}\",
              \"description\": \"ADO Build ${ADO_BUILD_ID} started\",
              \"context\": \"ADO Build\"
            }"
          echo "✅ Created pending commit status on source repo"

      - name: Azure Logout
        if: always()
        run: az logout
