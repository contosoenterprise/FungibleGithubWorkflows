# Verify ADO Bug ID exists via OIDC
# Receives dispatch from fungible-inc/GitHubWorkflows, authenticates via OIDC,
# checks the work item exists in ADO, and reports back to the source PR

name: Verify ADO Bug ID

on:
  repository_dispatch:
    types: [verify-ado-bug-id]

permissions:
  id-token: write
  contents: read

jobs:
  verify-ado:
    name: Verify ADO Bug ID
    runs-on: ubuntu-slim
    environment: copilot

    steps:
      - name: Extract dispatch payload
        id: info
        run: |
          echo "bug_id=${{ github.event.client_payload.bug_id }}" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.client_payload.pr_number }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.event.client_payload.commit_sha }}" >> $GITHUB_OUTPUT
          echo "source_repo=${{ github.event.client_payload.source_repo }}" >> $GITHUB_OUTPUT

          echo "📋 Received: Bug #${{ github.event.client_payload.bug_id }}"
          echo "   Source: ${{ github.event.client_payload.source_repo }} PR #${{ github.event.client_payload.pr_number }}"

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure DevOps access token
        id: get-token
        run: |
          ACCESS_TOKEN=$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ado_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Verify work item exists in ADO
        id: verify
        env:
          ADO_TOKEN: ${{ steps.get-token.outputs.ado_token }}
          BUG_ID: ${{ steps.info.outputs.bug_id }}
        run: |
          http_code=$(curl --silent --max-time 10 \
            --output /tmp/ado_response.json --write-out "%{http_code}" \
            -H "Authorization: Bearer ${ADO_TOKEN}" \
            "https://dev.azure.com/AzureCSI/Fungible/_apis/wit/workitems/${BUG_ID}?api-version=7.1")

          case "$http_code" in
            200)
              title=$(jq -r '.fields["System.Title"] // "Unknown"' /tmp/ado_response.json)
              state=$(jq -r '.fields["System.State"] // "Unknown"' /tmp/ado_response.json)
              type=$(jq -r '.fields["System.WorkItemType"] // "Unknown"' /tmp/ado_response.json)
              echo "✅ ADO work item ${BUG_ID}: ${type} — ${title} [${state}]"
              echo "status=success" >> "$GITHUB_OUTPUT"
              echo "description=${type}: ${title}" >> "$GITHUB_OUTPUT"
              ;;
            400)
              echo "::error::ADO rejected work item ID ${BUG_ID} as invalid."
              echo "status=failure" >> "$GITHUB_OUTPUT"
              echo "description=Invalid work item ID ${BUG_ID}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "::error::ADO work item ${BUG_ID} does not exist."
              echo "status=failure" >> "$GITHUB_OUTPUT"
              echo "description=Work item ${BUG_ID} not found in ADO" >> "$GITHUB_OUTPUT"
              ;;
            401|403)
              echo "::error::Authentication failed checking ADO work item ${BUG_ID}."
              echo "status=error" >> "$GITHUB_OUTPUT"
              echo "description=Auth failed checking work item ${BUG_ID}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected response (HTTP ${http_code}) checking ADO work item ${BUG_ID}."
              cat /tmp/ado_response.json
              echo "status=error" >> "$GITHUB_OUTPUT"
              echo "description=HTTP ${http_code} checking work item ${BUG_ID}" >> "$GITHUB_OUTPUT"
              ;;
          esac

          rm -f /tmp/ado_response.json

      - name: Report result to source repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_STATUS_TOKEN }}
          STATUS: ${{ steps.verify.outputs.status }}
          DESCRIPTION: ${{ steps.verify.outputs.description }}
          SHA: ${{ steps.info.outputs.commit_sha }}
          SOURCE_REPO: ${{ steps.info.outputs.source_repo }}
          PR_NUMBER: ${{ steps.info.outputs.pr_number }}
          BUG_ID: ${{ steps.info.outputs.bug_id }}
        run: |
          ADO_URL="https://dev.azure.com/AzureCSI/Fungible/_workitems/edit/${BUG_ID}"
          MARKER="<!-- ado-bug-id-check -->"

          # Set commit status
          curl --silent --max-time 10 -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${SOURCE_REPO}/statuses/${SHA}" \
            --data "$(jq -n \
              --arg state "$STATUS" \
              --arg desc "$DESCRIPTION" \
              --arg url "$ADO_URL" \
              '{state: $state, description: $desc, target_url: $url, context: "ADO Bug Verification"}')"

          # Build comment body
          if [ "$STATUS" = "success" ]; then
            BODY="${MARKER}
          ## ✅ ADO Bug ID Verified: [${BUG_ID}](${ADO_URL})

          **${DESCRIPTION}**"
          else
            BODY="${MARKER}
          ## ❌ ADO Bug ID Verification Failed

          **Bug ID:** [${BUG_ID}](${ADO_URL})
          **Error:** ${DESCRIPTION}

          Please check that the work item ID in your PR title is correct."
          fi

          # Update existing PR comment (left by check-title job)
          COMMENTS_URL="https://api.github.com/repos/${SOURCE_REPO}/issues/${PR_NUMBER}/comments"
          EXISTING=$(curl -s \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${COMMENTS_URL}?per_page=100" \
            | jq -r ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            curl -s -X PATCH \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${SOURCE_REPO}/issues/comments/${EXISTING}" \
              -d "$(jq -n --arg body "$BODY" '{body: $body}')"
          fi

          echo "📋 Reported '${STATUS}' to ${SOURCE_REPO} PR #${PR_NUMBER}"
