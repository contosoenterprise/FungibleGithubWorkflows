# Verify ADO Bug ID exists via OIDC
# Receives dispatch from fungible-inc/GitHubWorkflows, authenticates via OIDC,
# checks the work item exists in ADO, and reports back to the source PR

name: Verify ADO Bug ID

on:
  repository_dispatch:
    types: [verify-ado-bug-id]

permissions:
  id-token: write
  contents: read

jobs:
  verify-ado:
    name: Verify ADO Bug ID
    runs-on: ubuntu-latest
    environment: copilot

    # Add new ADO org/project endpoints here (space-separated).
    # Note: msazure is listed twice — the dev.azure.com host appears to be
    # dropped from hosted runners, so the legacy *.visualstudio.com host is
    # included as a fallback (same backend work item, identical REST API).
    env:
      ADO_ENDPOINTS: >-
        https://dev.azure.com/AzureCSI/Fungible
        https://dev.azure.com/msazure/One
        https://msazure.visualstudio.com/One

    steps:
      - name: Extract dispatch payload
        id: info
        run: |
          {
            echo "bug_id=${{ github.event.client_payload.bug_id }}"
            echo "pr_number=${{ github.event.client_payload.pr_number }}"
            echo "commit_sha=${{ github.event.client_payload.commit_sha }}"
            echo "source_repo=${{ github.event.client_payload.source_repo }}"
          } >> "$GITHUB_OUTPUT"

          echo "📋 Received: Bug #${{ github.event.client_payload.bug_id }}"
          echo "   Source: ${{ github.event.client_payload.source_repo }} PR #${{ github.event.client_payload.pr_number }}"

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure DevOps access token
        id: get-token
        run: |
          ACCESS_TOKEN=$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ado_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Probe ADO connectivity and authorization
        env:
          ADO_TOKEN: ${{ steps.get-token.outputs.ado_token }}
        run: |
          # Diagnostic only — never fails the job. For each endpoint, hits the
          # org's projects API to classify it as REACHABLE+AUTHORIZED,
          # REACHABLE-but-UNAUTHORIZED, or UNREACHABLE (network/egress).
          # On an unreachable host it additionally probes DNS + TCP connect so
          # the failure self-classifies as "DNS fail" vs "TCP blocked" vs
          # "connected but no HTTP response".
          read -ra endpoints <<< "$ADO_ENDPOINTS"

          for endpoint in "${endpoints[@]}"; do
            # Strip the trailing /<project> to get the org root for the projects API
            org="${endpoint%/*}"
            echo "🔎 Probing ${org}..."

            curl_err=0
            http_code=$(curl --silent --max-time 25 \
              --output /dev/null --write-out "%{http_code}" \
              -H "Authorization: Bearer ${ADO_TOKEN}" \
              "${org}/_apis/projects?api-version=7.1") || curl_err=$?
            http_code=${http_code:-000}

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "   ✅ REACHABLE + AUTHORIZED (HTTP ${http_code}) — OIDC identity can access ${org}"

              # Ask ADO who it thinks we are. connectionData.authenticatedUser is
              # the single most useful signal for a TF401232 "exists or no
              # permission" puzzle: if it shows the expected service principal the
              # token is honored and the problem is purely work-item/area-path
              # read permission; if it shows an anonymous/public identity the token
              # is being silently dropped for this org.
              #
              # NOTE: connectionData is a *preview* API — it MUST be called with
              # api-version=7.1-preview. Calling it as plain 7.1 returns a
              # VssInvalidPreviewVersionException error body (not identity data),
              # which makes authenticatedUser read as null.
              conn_http=$(curl --silent --max-time 25 --output /tmp/ado_conn.json \
                --write-out "%{http_code}" \
                -H "Authorization: Bearer ${ADO_TOKEN}" \
                "${org}/_apis/connectionData?api-version=7.1-preview") || conn_http=000
              if [ "$conn_http" -ge 200 ] && [ "$conn_http" -lt 300 ]; then
                auth_name=$(jq -r '.authenticatedUser.providerDisplayName // .authenticatedUser.customDisplayName // "Unknown"' /tmp/ado_conn.json 2>/dev/null)
                auth_desc=$(jq -r '.authenticatedUser.subjectDescriptor // .authenticatedUser.descriptor // ""' /tmp/ado_conn.json 2>/dev/null)
                auth_id=$(jq -r '.authenticatedUser.id // ""' /tmp/ado_conn.json 2>/dev/null)
                echo "      • Identity ADO sees: ${auth_name}${auth_desc:+ (${auth_desc})}${auth_id:+ [id ${auth_id}]}"
                # An anonymous/public connection resolves to the well-known
                # all-zero GUID; the bearer token is not being honored if so.
                case "$auth_id" in
                  00000000-0000-0000-0000-000000000000|"")
                    echo "      ⚠️  This looks like an anonymous/public identity — the bearer token may not be honored for ${org}." ;;
                esac
              else
                echo "      • Could not read connectionData (HTTP ${conn_http}) to confirm the authenticated identity."
              fi
              rm -f /tmp/ado_conn.json
            elif [ "$http_code" -eq 401 ] || [ "$http_code" -eq 403 ]; then
              echo "   ⛔ REACHABLE but UNAUTHORIZED (HTTP ${http_code}) — federated identity is NOT a member of ${org}. Add it in ADO org settings."
            elif [ "$curl_err" -eq 28 ] || [ "$http_code" -eq 000 ]; then
              echo "   🌐 UNREACHABLE (curl exit ${curl_err}, no HTTP response) — network/egress problem reaching ${org}, not an auth issue."

              # Drill into *why* it is unreachable. Pull the host out of the URL.
              host="${org#*://}"
              host="${host%%/*}"

              # 1) DNS resolution
              if resolved=$(getent hosts "$host" 2>/dev/null); then
                echo "      • DNS: ✅ ${host} resolves to $(echo "$resolved" | awk '{print $1}' | paste -sd, -)"
              else
                echo "      • DNS: ❌ ${host} did NOT resolve — name resolution / DNS egress problem."
              fi

              # 2) TCP connect + TLS handshake timing (no request sent).
              #    curl reports connect/appconnect times; a 0.000000 appconnect
              #    with a non-zero connect means TLS was blocked, etc.
              probe_err=0
              timings=$(curl --silent --max-time 25 --output /dev/null \
                --write-out "connect=%{time_connect}s tls=%{time_appconnect}s" \
                "https://${host}/") || probe_err=$?
              if [ "$probe_err" -eq 0 ]; then
                echo "      • TCP/TLS: ✅ connected (${timings}) — host is reachable; the API call itself stalled."
              elif [ "$probe_err" -eq 28 ]; then
                echo "      • TCP/TLS: ❌ connect timed out (curl exit 28) — TCP/443 to ${host} is blocked or dropped (egress firewall)."
              else
                echo "      • TCP/TLS: ❌ failed (curl exit ${probe_err}) connecting to ${host}."
              fi
            else
              echo "   ❓ Unexpected (HTTP ${http_code}, curl exit ${curl_err}) from ${org}."
            fi
          done

      - name: Verify work item exists in ADO
        id: verify
        env:
          ADO_TOKEN: ${{ steps.get-token.outputs.ado_token }}
          BUG_ID: ${{ steps.info.outputs.bug_id }}
        run: |
          # ADO_ENDPOINTS is defined at job level — add new orgs there
          read -ra endpoints <<< "$ADO_ENDPOINTS"

          found=false
          for endpoint in "${endpoints[@]}"; do
            echo "🔍 Checking ${endpoint}..."

            # Work item IDs are org-scoped, not project-scoped. Strip the trailing
            # /<project> so the lookup resolves any item in the org; including the
            # project in the path returns 404 when the item lives in another project.
            org="${endpoint%/*}"

            # Retry up to 3 times on 429 (rate limit) or transient network
            # failures (curl timeout exit 28 / no HTTP response).
            for attempt in 1 2 3; do
              # `|| true` so a curl failure (e.g. timeout exit 28) doesn't abort
              # the step under `bash -e`; capture the exit code to tell a network
              # failure apart from an HTTP auth/permission response.
              curl_err=0
              http_code=$(curl --silent --max-time 10 \
                --output /tmp/ado_response.json --write-out "%{http_code}" \
                -H "Authorization: Bearer ${ADO_TOKEN}" \
                "${org}/_apis/wit/workitems/${BUG_ID}?api-version=7.1") || curl_err=$?
              http_code=${http_code:-000}

              if [ "$http_code" -eq 429 ]; then
                retry_after=$(jq -r '.retryAfter // empty' /tmp/ado_response.json 2>/dev/null)
                wait_secs=${retry_after:-$((attempt * 5))}
                echo "⏳ Rate limited by ${endpoint}, retrying in ${wait_secs}s (attempt ${attempt}/3)..."
                sleep "$wait_secs"
              elif { [ "$curl_err" -eq 28 ] || [ "$http_code" -eq 000 ]; } && [ "$attempt" -lt 3 ]; then
                wait_secs=$((attempt * 3))
                echo "🌐 No response from ${endpoint} (curl exit ${curl_err}), retrying in ${wait_secs}s (attempt ${attempt}/3)..."
                sleep "$wait_secs"
              else
                break
              fi
            done

            if [ "$http_code" -eq 200 ]; then
              title=$(jq -r '.fields["System.Title"] // "Unknown"' /tmp/ado_response.json)
              state=$(jq -r '.fields["System.State"] // "Unknown"' /tmp/ado_response.json)
              type=$(jq -r '.fields["System.WorkItemType"] // "Unknown"' /tmp/ado_response.json)
              echo "✅ ADO work item ${BUG_ID}: ${type} — ${title} [${state}]"
              {
                echo "status=success"
                echo "description=${type}: ${title}"
                echo "ado_url=${endpoint}/_workitems/edit/${BUG_ID}"
              } >> "$GITHUB_OUTPUT"
              found=true
              break
            elif [ "$http_code" -eq 400 ]; then
              # A 400 means ADO considers the ID malformed/invalid. Treat this as a
              # non-blocking warning rather than a failing check — we surface it to
              # the author but never fail the PR on it.
              echo "::warning::ADO does not recognize work item ID ${BUG_ID} as valid."
              {
                echo "status=success"
                echo "description=Work item ID ${BUG_ID} does not appear to be valid"
                echo "ado_url="
                echo "invalid=true"
              } >> "$GITHUB_OUTPUT"
              found=true
              break
            elif [ "$http_code" -eq 401 ] || [ "$http_code" -eq 403 ]; then
              echo "⚠️  No access to ${endpoint} (HTTP ${http_code}) — the federated identity is reachable but not authorized for this org/project. Skipping..."
              continue
            elif [ "$http_code" -eq 404 ]; then
              # ADO returns 404 both for "doesn't exist" and "no permission to the
              # area/project". The .message alone (TF401232) is deliberately
              # ambiguous, but the rest of the error body carries the real
              # exception type, which DOES distinguish the two cases:
              #   typeKey=WorkItemExistenceException  -> truly absent OR no read perm
              #   typeKey=...PermissionException / errorCode!=0 -> permission denied
              ado_msg=$(jq -r '.message // empty' /tmp/ado_response.json 2>/dev/null)
              ado_typekey=$(jq -r '.typeKey // empty' /tmp/ado_response.json 2>/dev/null)
              ado_typename=$(jq -r '.typeName // empty' /tmp/ado_response.json 2>/dev/null)
              ado_errcode=$(jq -r '.errorCode // empty' /tmp/ado_response.json 2>/dev/null)
              ado_eventid=$(jq -r '.eventId // empty' /tmp/ado_response.json 2>/dev/null)
              echo "   Not found in ${endpoint} (HTTP 404)${ado_msg:+ — $ado_msg}"
              echo "      • typeKey=${ado_typekey:-<none>} typeName=${ado_typename:-<none>} errorCode=${ado_errcode:-<none>} eventId=${ado_eventid:-<none>}"
              echo "      • Full error body:"
              jq -c '.' /tmp/ado_response.json 2>/dev/null | sed 's/^/        /' || sed 's/^/        /' /tmp/ado_response.json
              continue
            elif [ "$curl_err" -eq 28 ] || [ "$http_code" -eq 000 ]; then
              echo "⚠️  Could not reach ${endpoint} (curl exit ${curl_err}, no HTTP response). This is a network/egress problem, not an auth failure. Skipping..."
              continue
            else
              echo "⚠️  Unexpected response (HTTP ${http_code}, curl exit ${curl_err}) from ${endpoint}, skipping..."
              continue
            fi
          done

          if [ "$found" = false ]; then
            echo "⚠️ ADO work item ${BUG_ID} not found in any accessible ADO project."
            {
              echo "status=success"
              echo "description=Work item ${BUG_ID} not found in accessible projects"
              echo "ado_url="
              echo "unverified=true"
            } >> "$GITHUB_OUTPUT"
          fi

          rm -f /tmp/ado_response.json

      - name: Report result to source repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_STATUS_TOKEN }}
          STATUS: ${{ steps.verify.outputs.status }}
          DESCRIPTION: ${{ steps.verify.outputs.description }}
          SHA: ${{ steps.info.outputs.commit_sha }}
          SOURCE_REPO: ${{ steps.info.outputs.source_repo }}
          PR_NUMBER: ${{ steps.info.outputs.pr_number }}
          BUG_ID: ${{ steps.info.outputs.bug_id }}
        run: |
          ADO_URL="${{ steps.verify.outputs.ado_url }}"
          UNVERIFIED="${{ steps.verify.outputs.unverified }}"
          INVALID="${{ steps.verify.outputs.invalid }}"
          MARKER="<!-- ado-bug-id-check -->"

          # Set commit status
          status_data=$(jq -n \
            --arg state "$STATUS" \
            --arg desc "$DESCRIPTION" \
            --arg url "$ADO_URL" \
            'if $url != "" then
              {state: $state, description: $desc, target_url: $url, context: "ADO Bug Verification"}
            else
              {state: $state, description: $desc, context: "ADO Bug Verification"}
            end')

          curl --silent --max-time 10 -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${SOURCE_REPO}/statuses/${SHA}" \
            --data "$status_data"

          # Build comment body
          if [ "$STATUS" = "success" ] && [ "$INVALID" = "true" ]; then
            BODY="${MARKER}
          ## ⚠️ ADO Bug ID: **${BUG_ID}**

          Work item ID **${BUG_ID}** does not appear to be a valid ADO work item ID.
          Please double-check the ID in your PR title."
          elif [ "$STATUS" = "success" ] && [ "$UNVERIFIED" = "true" ]; then
            BODY="${MARKER}
          ## ⚠️ ADO Bug ID: **${BUG_ID}**

          Work item **${BUG_ID}** was not found in any ADO project the bot has access to.
          It may exist in another project — please verify the ID is correct."
          elif [ "$STATUS" = "success" ]; then
            BODY="${MARKER}
          ## ✅ ADO Bug ID Verified: [${BUG_ID}](${ADO_URL})

          **${DESCRIPTION}**"
          elif [ -n "$ADO_URL" ]; then
            BODY="${MARKER}
          ## ❌ ADO Bug ID Verification Failed

          **Bug ID:** [${BUG_ID}](${ADO_URL})
          **Error:** ${DESCRIPTION}

          Please check that the work item ID in your PR title is correct."
          else
            BODY="${MARKER}
          ## ❌ ADO Bug ID Verification Failed

          **Bug ID:** ${BUG_ID}
          **Error:** ${DESCRIPTION}

          Please check that the work item ID in your PR title is correct."
          fi

          # Update existing PR comment (left by check-title job)
          COMMENTS_URL="https://api.github.com/repos/${SOURCE_REPO}/issues/${PR_NUMBER}/comments"
          EXISTING=$(curl -s \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${COMMENTS_URL}?per_page=100" \
            | jq -r ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            curl -s -X PATCH \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${SOURCE_REPO}/issues/comments/${EXISTING}" \
              -d "$(jq -n --arg body "$BODY" '{body: $body}')"
          fi

          echo "📋 Reported '${STATUS}' to ${SOURCE_REPO} PR #${PR_NUMBER}"
